server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 138.68.8.134 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/airawedding;
        try_files $uri =404;
    }

    location / {
        return 308 https://138.68.8.134$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name 138.68.8.134 _;
    ssl_certificate /etc/letsencrypt/live/138.68.8.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.68.8.134/privkey.pem;
    root /var/www/airawedding;
    index index.html;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|mp3)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /assets/our-song.mp3 {
        try_files $uri =404;
        types { audio/mpeg mp3; }
        add_header Accept-Ranges bytes;
        expires 7d;
    }
}
