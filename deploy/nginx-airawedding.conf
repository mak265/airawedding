server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 138.68.8.134 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/airawedding;
        try_files $uri =404;
    }

    location / {
        return 308 https://138.68.8.134$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name 138.68.8.134 _;
    ssl_certificate /etc/letsencrypt/live/138.68.8.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.68.8.134/privkey.pem;
    root /var/www/airawedding;
    index index.html;

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Wedding invitation admin";
        auth_basic_user_file /etc/nginx/airawedding-admin.htpasswd;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    location = /admin/api/invites {
        auth_basic "Wedding invitation admin";
        auth_basic_user_file /etc/nginx/airawedding-admin.htpasswd;
        client_max_body_size 2k;
        access_log off;
        proxy_pass http://127.0.0.1:4182;
        proxy_set_header Authorization "";
    }

    location ^~ /api/invites/ {
        access_log off;
        proxy_pass http://127.0.0.1:4182;
    }

    location ^~ /deploy/ { return 404; }
    location ^~ /tests/ { return 404; }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|mp3)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /assets/our-song.mp3 {
        try_files $uri =404;
        types { audio/mpeg mp3; }
        add_header Accept-Ranges bytes;
        expires 7d;
    }
}
