server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 138.68.8.134 _;
    root /var/www/airawedding;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|mp3)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /assets/our-song.mp3 {
        try_files $uri =404;
        types { audio/mpeg mp3; }
        add_header Accept-Ranges bytes;
        expires 7d;
    }
}
