server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 138.68.8.134 karlandairawedding.duckdns.org _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/airawedding;
        try_files $uri =404;
    }

    location / {
        return 308 https://karlandairawedding.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name 138.68.8.134 _;
    ssl_certificate /etc/letsencrypt/live/138.68.8.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.68.8.134/privkey.pem;
    include /etc/nginx/airawedding-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name karlandairawedding.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/karlandairawedding.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karlandairawedding.duckdns.org/privkey.pem;
    include /etc/nginx/airawedding-routes.conf;
}
